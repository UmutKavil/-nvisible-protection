[honeypot]
hostname = ubuntu
timezone = UTC

[ssh]
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5

[telnet]
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json

[output_ttylog]
enabled = true
logfile = var/lib/cowrie/tty/{session}.log

[download]
enabled = false
path = var/lib/cowrie/downloads
