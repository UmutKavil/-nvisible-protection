services:
  dionaea:
    platform: linux/amd64
    image: dinotools/dionaea@sha256:6f06d0a6035c865cb60ef51bd96ff3b1f25ee4bfcd852dad3f551bc2d93464ca
    container_name: invisible-dionaea
    restart: unless-stopped
    cpuset: "3"
    mem_limit: 256m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /opt/dionaea/var/log/dionaea/dionaea.log || test -d /opt/dionaea/var/lib"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "21:21"
      - "2224:22"
      - "2323:23"
      - "80:80"
      - "445:445"
      - "3306:3306"
    volumes:
      - /opt/guardian/malware_samples:/opt/dionaea/var/dionaea/binaries:rw
      - /opt/guardian/logs/active/dionaea:/var/lib/dionaea:rw
