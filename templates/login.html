<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardian SOC - Giriş</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      align-items: center; background: #080b12; color: #e8edf7; display: flex;
      font-family: system-ui, sans-serif; justify-content: center; min-height: 100vh;
      margin: 0; padding: 1rem;
    }
    .card {
      background: #111827; border: 1px solid #263247; border-radius: 16px;
      box-shadow: 0 24px 80px #0008; max-width: 420px; padding: 2rem; width: 100%;
    }
    h1 { font-size: 1.65rem; margin: 0 0 .4rem; }
    p { color: #93a4bd; margin: 0 0 1.8rem; }
    label { color: #b7c3d6; display: block; font-size: .9rem; margin: 1rem 0 .4rem; }
    input {
      background: #0b1220; border: 1px solid #34445e; border-radius: 8px;
      color: #fff; font-size: 1rem; padding: .8rem; width: 100%;
    }
    input:focus { border-color: #45a3ff; outline: 2px solid #45a3ff55; }
    button {
      background: #1683e8; border: 0; border-radius: 8px; color: white; cursor: pointer;
      font-size: 1rem; font-weight: 700; margin-top: 1.5rem; padding: .85rem; width: 100%;
    }
    button:hover { background: #3b9df2; }
    .error { background: #491d2a; border: 1px solid #b83d5d; border-radius: 8px;
      color: #ffb8c8; padding: .75rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Guardian SOC</h1>
    <p>Güvenli izleme paneline giriş yapın.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Kullanıcı adı</label>
      <input id="username" name="username" required autocomplete="username">
      <label for="password">Şifre</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <label for="totp_code">2FA kodu</label>
      <input id="totp_code" name="totp_code" inputmode="numeric" pattern="[0-9]{6}"
             maxlength="6" required autocomplete="one-time-code">
      <button type="submit">Giriş yap</button>
    </form>
  </main>
</body>
</html>
